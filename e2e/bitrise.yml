format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - TEST_APP_URL: https://github.com/bitrise-io/Bitrise-Android-Sample
  - BRANCH: main

workflows:
  test_test_collection:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: ./_tmp
        - branch: $BRANCH
    - git::https://github.com/bitrise-steplib/bitrise-step-activate-gradle-features.git:
        run_if: "true"
        is_skippable: false
        inputs:
        - build_cache_enabled: false
        - build_cache_push: false
        - build_cache_validation_level: none
        - test_distribution_enabled: true
        - test_distribution_shard_size: 50
        - verbose: false
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
    - android-unit-test:
        title: Test App
        inputs:
        - module: app
        - variant: debug
    - path::./:
        title: Execute step
        run_if: "true"
        is_skippable: false
    - script:
        title: Check if the step is working
        inputs:
        - content: |-
            #!/bin/bash
            set -ex

            # Check if output dir is empty or not
            if [ -z "$(ls -A -- "$BITRISE_TEST_RESULT_DIR" 2>/dev/null)" ]; then
              echo "Test results were expected but the output directory is empty."
              exit 1
            fi

            ls -al "$BITRISE_TEST_RESULT_DIR"
            echo "Step works as expected."
