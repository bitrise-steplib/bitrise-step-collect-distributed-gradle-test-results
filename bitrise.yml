format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - skip_go_checks: "yes"
        - workflow: lint

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e
        - skip_go_checks: "yes"

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }

  test_run_the_step:
    envs:
    - TEST_APP_URL: git@github.com:duckduckgo/Android.git
    - BRANCH: develop
    - BITRISEIO_BUILD_CACHE_ENABLED: true
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: ./_tmp
        - branch: $BRANCH
    - git::https://github.com/bitrise-steplib/bitrise-step-activate-gradle-features.git@main:
        run_if: "true"
        is_skippable: false
        inputs:
        - build_cache_enabled: true
        - build_cache_push: false
        - build_cache_validation_level: none
        - test_distribution_enabled: true
        - test_distribution_shard_size: 200
        - verbose: true
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
    - android-unit-test:
        title: Test App
        inputs:
        - module: autofill-impl
        - variant: debug
        - arguments: --no-configuration-cache
    - path::./:
        title: Execute step
        run_if: "true"
        is_skippable: false
